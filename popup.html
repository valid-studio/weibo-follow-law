<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微博关注列表定律</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wbr-pop-app">
    <header class="wbr-pop-header">
      <div class="wbr-pop-brand">
        <img src="icons/icon48.png" srcset="icons/icon48.png 1x, icons/icon128.png 2x" alt="微博关注列表定律" width="32" height="32" />
        <div class="wbr-pop-title-col">
          <h1>微博关注列表定律</h1>
          <div id="wbr-account-line" class="wbr-pop-sub">正在检查微博登录状态...</div>
        </div>
      </div>
      <label class="wbr-switch" title="开启或暂停保护">
        <input id="wbr-opt-enabled" type="checkbox" />
        <span class="wbr-slider"></span>
      </label>
    </header>

    <div id="wbr-breaker-alert" class="wbr-alert hidden">
      <div id="wbr-breaker-text" class="wbr-alert-text">请求有点快，休息冷却中（约 10 分钟后自动恢复，本地屏蔽仍正常生效）</div>
      <button id="wbr-btn-reset-breaker" type="button" class="wbr-btn wbr-btn-warn-xs">立即恢复</button>
    </div>

    <section class="wbr-mode-card">
      <div class="wbr-mode-seg" role="tablist" aria-label="检测模式">
        <button id="wbr-mode-manual" type="button" role="tab" class="wbr-mode-btn is-active" data-mode="manual" aria-selected="true"><svg class="wbr-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.8"/></svg><span>手动按需</span></button>
        <button id="wbr-mode-auto" type="button" role="tab" class="wbr-mode-btn" data-mode="auto" aria-selected="false"><svg class="wbr-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1.5L3.5 9h4.3L7 14.5 12.5 7H8.2L9 1.5z"/></svg><span>自动检测</span></button>
      </div>
      <div id="wbr-mode-desc" class="wbr-mode-desc">悬停用户名按需查成分，或点击下方按钮扫描</div>
    </section>

    <section class="wbr-pop-primary">
      <button id="wbr-btn-scan-page" type="button" class="wbr-btn wbr-btn-primary"><svg class="wbr-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="M10.7 10.7L14 14"/></svg><span>扫描当前页可见用户</span></button>
    </section>

    <section class="wbr-pop-bottom-row">
      <button id="wbr-btn-dashboard" type="button" class="wbr-btn wbr-btn-secondary wbr-btn-grow">屏蔽名单 (0) · 设置</button>
      <button id="wbr-btn-sync-blocklist" type="button" class="wbr-btn wbr-btn-secondary">同步黑名单</button>
    </section>

    <footer class="wbr-pop-footer">
      <span id="wbr-pop-status">v1.5.6 · 开源本地版</span>
      <a class="wbr-pop-link" href="https://github.com/valid-studio/weibo-follow-law" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
  </div>
  <script src="shared/radar_engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
